<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detector de Sistema Operacional</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
      background-color: #f4f4f4;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: inline-block;
    }
    h1 {
      margin-bottom: 20px;
    }
    p {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Detectando o Sistema Operacional...</h1>
    <p id="resultado">Aguarde...</p>
  </div>

  <script>
    function detectarSO() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      let sistemaOperacional = "Desconhecido";

      if (/android/i.test(userAgent)) {
        sistemaOperacional = "Android";
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        sistemaOperacional = "iOS";
      } else if (/Windows Phone/i.test(userAgent)) {
        sistemaOperacional = "Windows Phone";
      } else if (/windows/i.test(userAgent)) {
        sistemaOperacional = "Windows";
      } else if (/macintosh|mac os x/i.test(userAgent)) {
        sistemaOperacional = "macOS";
      } else if (/linux/i.test(userAgent)) {
        sistemaOperacional = "Linux";
      }

      document.getElementById("resultado").innerText = "Sistema operacional detectado: " + sistemaOperacional;
    }

    detectarSO();
  </script>
</body>
</html>
